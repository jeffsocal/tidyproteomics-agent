<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>tidyproteomics-agent — Autonomous Proteomics Workbench</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('tpa-theme') || 'dark';
          var validThemes = ['dark', 'twilight', 'cloudy', 'dawn', 'bright'];
          var theme = stored;
          if (!validThemes.includes(theme)) {
            if (theme === 'sandy') theme = 'dawn';
            else if (theme === 'dim') theme = 'twilight';
            else if (theme === 'light') theme = 'bright';
            else theme = 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) {
            meta.content = (theme === 'dawn' || theme === 'bright') ? 'light' : 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
