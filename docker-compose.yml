services:
  tidyproteomics-agent:
    image: ghcr.io/jeffsocal/tidyproteomics-agent:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tidyproteomics-agent
    ports:
      - "3000:3000"
    volumes:
      # Mount ~/tidyproteomics_agent on the host (Docker creates it automatically if missing)
      # so all prompts, code, data, plots, and logs are written directly to your host disk:
      - ${HOME}/tidyproteomics_agent:/tidyproteomics_agent
      # Persist studio settings across container restarts:
      - tidyproteomics-config:/root/.tidyproteomics-agent
    environment:
      - PORT=3000
      - TIDY_WORKSPACE=/tidyproteomics_agent/project_01
      - TIDY_MCP_MODE=local
      - TIDY_MCP_SERVER_PATH=/app/mcp/server.py
      # Optional: Pass LLM & Search API keys via environment or configure in the Left Project Settings UI
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NCBI_API_KEY=${NCBI_API_KEY:-}
    restart: unless-stopped

volumes:
  tidyproteomics-config:

